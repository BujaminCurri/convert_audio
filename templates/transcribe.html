<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcribe · Quiet Transcribe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">Quiet Transcribe</a>
  <a class="link" href="/">Home</a>
</header>
<main>
  <section class="panel">
    <h2>Transcribe audio</h2>
    <p class="lead">Choose a recording, add your Gemini API key, and press the button. Longer files can take a minute or two.</p>

    <form id="form">
    {% csrf_token %}
      <div>
        <label for="audio">Audio file</label>
        <input type="file" id="audio" name="audio" accept="audio/*" required>
      </div>
      <div>
        <label for="api_key">Gemini API key <span class="hint">Used for this request only. It is not saved.</span></label>
        <input type="password" id="api_key" name="api_key" autocomplete="off" required>
      </div>
      <div>
        <label for="prompt">Prompt <span class="hint">You can edit the instructions Gemini receives.</span></label>
        <textarea id="prompt" name="prompt">
            Please transcribe this audio recording accurately. 
            The speaker is primarily speaking in Albanian (Shqip), 
            but may also recite phrases or verses in Arabic (such as Quranic ayat).
            Put Arabic phrases or Quranic verses on their own separate lines. 
            Transcribe ALL speech exactly as spoken — Albanian in Latin script, Arabic in Arabic script. 
            Return ONLY the transcribed text. Do not translate, summarize, or add any commentary.    
        </textarea>
      </div>
      <div>
        <button class="btn" id="submit" type="submit">Transcribe</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>

<script>
const form = document.getElementById('form');
const btn = document.getElementById('submit');
const statusEl = document.getElementById('status');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  statusEl.className = 'status';
  statusEl.textContent = 'Transcribing… please keep this page open.';
  btn.disabled = true;
  btn.textContent = 'Transcribing…';

  try {
    const res = await fetch('/api/transcribe', { method: 'POST', body: new FormData(form) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.text) {
      throw new Error(data.error || 'Something went wrong. Check your API key and file, then try again.');
    }
    try {
      sessionStorage.setItem('transcript', data.text);
      sessionStorage.setItem('filename', document.getElementById('audio').files[0].name);
    } catch (_) {}
    window.location.href = '/generate_pdf';
  } catch (err) {
    statusEl.className = 'status error';
    statusEl.textContent = err.message;
    btn.disabled = false;
    btn.textContent = 'Transcribe';
  }
});
</script>
</body>
</html>
